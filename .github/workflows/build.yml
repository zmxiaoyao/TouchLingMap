name: build-apk
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build native grab tool (EVIOCGRAB 独占背屏触摸 → jniLibs)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$NDK" ] && [ -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" ]; then
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" \
              -O2 -Wall -static -o app/src/main/jniLibs/arm64-v8a/libgrab.so native/grab.c
          else
            echo "NDK not found, fallback to cross gcc"
            sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
            aarch64-linux-gnu-gcc -O2 -Wall -static -o app/src/main/jniLibs/arm64-v8a/libgrab.so native/grab.c
          fi
          file app/src/main/jniLibs/arm64-v8a/libgrab.so
          ls -la app/src/main/jniLibs/arm64-v8a/libgrab.so

      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TouchLingMap-debug
          path: app/build/outputs/apk/debug/*.apk